<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        :root {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #eef2f7;
            color: #1f2937;
        }
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .login-card {
            width: min(420px, calc(100% - 32px));
            background: #ffffff;
            border-radius: 24px;
            box-shadow: 0 24px 80px rgba(15, 23, 42, 0.12);
            overflow: hidden;
        }
        .login-header {
            padding: 32px;
            background: #4f46e5;
            color: #ffffff;
            text-align: center;
        }
        .login-header h1 {
            margin: 0;
            font-size: 1.75rem;
        }
        .login-header p {
            margin: 8px 0 0;
            opacity: 0.85;
            font-size: 0.95rem;
        }
        .login-body {
            padding: 32px;
        }
        .form-group {
            margin-bottom: 18px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.95rem;
            font-weight: 600;
        }
        input {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid #d1d5db;
            border-radius: 12px;
            font-size: 1rem;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }
        input:focus {
            outline: none;
            border-color: #4f46e5;
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.12);
        }
        .submit-button {
            width: 100%;
            padding: 14px 16px;
            border: none;
            border-radius: 12px;
            background: #4f46e5;
            color: #ffffff;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s ease, background 0.2s ease;
        }
        .submit-button:hover {
            background: #4338ca;
            transform: translateY(-1px);
        }
        .actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-top: 16px;
            font-size: 0.95rem;
        }
        .actions a {
            color: #4f46e5;
            text-decoration: none;
        }
        .actions a:hover {
            text-decoration: underline;
        }
        .status-message {
            margin-top: 18px;
            padding: 14px 16px;
            border-radius: 12px;
            background: #eff6ff;
            color: #1d4ed8;
            display: none;
        }
    </style>
</head>
<body>
    <main class="login-card">
        <section class="login-header">
            <h1>Welcome Back</h1>
            <p>Sign in to access your account</p>
        </section>
        <section class="login-body">
            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Email address</label>
                    <input type="email" id="email" name="email" placeholder="you@example.com" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter your password" required>
                </div>
                <button type="submit" class="submit-button">Log In</button>
                <div class="actions">
                    
                    <a href="#">Forgot password?</a>
                </div>
                <div class="status-message" id="statusMessage"></div>
            </form>
        </section>
    </main>
    
</body>
</html>
